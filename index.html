<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حساب ساعات العمل والربح</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="container">
    <h2>تتبع العمل والربح</h2>

    <!-- 1. الربح في الساعة -->
    <div class="form-group">
        <label>الربح للساعة (د.ج):</label>
        <input type="number" id="hourlyRate" value="14000">
    </div>

    <!-- 2. وقت الدخول والخروج -->
    <div class="time-inputs">
        <div class="form-group" style="flex: 1;">
            <label>دخول:</label>
            <input type="time" id="timeIn">
        </div>
        <div class="form-group" style="flex: 1;">
            <label>خروج:</label>
            <input type="time" id="timeOut">
        </div>
    </div>

    <!-- 3. زر التأكيد -->
    <button class="btn-confirm" onclick="calculateWork()">تأكيد الوقت</button>

    <!-- 4. المجموع الكلي -->
    <div class="result-box">
        <p>إجمالي الساعات: <span id="totalHours">0</span> ساعة</p>
        <p>إجمالي الربح: <span id="totalEarnings">0</span> د.ج</p>
    </div>

    <!-- 5. زر تصفير العداد -->
    <button class="btn-reset" onclick="resetCounter()">تصفير العداد</button>
</div>

<script>
    // تحميل البيانات المحفوظة عند فتح الصفحة
    let totalMinutes = parseInt(localStorage.getItem('totalMinutes')) || 0;
    let savedMonth = localStorage.getItem('savedMonth');
    const currentMonth = new Date().getMonth();

    // التصفير التلقائي في بداية كل شهر جديد
    if (savedMonth !== null && parseInt(savedMonth) !== currentMonth) {
        totalMinutes = 0;
        localStorage.setItem('totalMinutes', 0);
    }
    localStorage.setItem('savedMonth', currentMonth);

    updateDisplay();

    function calculateWork() {
        const timeIn = document.getElementById('timeIn').value;
        const timeOut = document.getElementById('timeOut').value;

        if (!timeIn || !timeOut) {
            alert('يرجى إدخال وقت الدخول ووقت الخروج');
            return;
        }

        // تحويل الوقت إلى دقائق
        const [inHours, inMins] = timeIn.split(':').map(Number);
        const [outHours, outMins] = timeOut.split(':').map(Number);

        let startInMinutes = inHours * 60 + inMins;
        let endInMinutes = outHours * 60 + outMins;

        // معالجة حالة العمل عبر منتصف الليل
        if (endInMinutes < startInMinutes) {
            endInMinutes += 24 * 60;
        }

        const diffMinutes = endInMinutes - startInMinutes;
        totalMinutes += diffMinutes;

        // حفظ المجموع الجديد
        localStorage.setItem('totalMinutes', totalMinutes);
        updateDisplay();

        // تفريغ المدخلات بعد الحساب
        document.getElementById('timeIn').value = '';
        document.getElementById('timeOut').value = '';
    }

    function updateDisplay() {
        const hourlyRate = parseFloat(document.getElementById('hourlyRate').value) || 0;
        const totalHours = (totalMinutes / 60).toFixed(2);
        const totalEarnings = (totalHours * hourlyRate).toLocaleString('ar-DZ');

        document.getElementById('totalHours').innerText = totalHours;
        document.getElementById('totalEarnings').innerText = totalEarnings;
    }

    function resetCounter() {
        if (confirm('هل أنت تأكد من تصفير العداد؟')) {
            totalMinutes = 0;
            localStorage.setItem('totalMinutes', 0);
            updateDisplay();
        }
    }

    // تحديث الأرقام مباشرة عند تغيير سعر الساعة
    document.getElementById('hourlyRate').addEventListener('input', updateDisplay);
</script>

</body>
</html>
